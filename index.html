   <style>

    *{
      box-sizing: border-box;

    :root{
     --bg-color: #1f61dc;
     --primary-color: #A9EA05;
     --secondary-color: #FFFFFF;
     --terciary-color: #000004;
    }
     body {
        background:var(--bg-color);
      }
.dm-sans-cuerpo {
  font-family: "DM Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 700;
  font-style: normal;
}
    div{

    }
    header h2{

      color:var(--bg-color);

    }
    ul{
      text-align: center;
    }
    ul li{
      list-style-type: none;
      display: inline-block;
      background:var(--secondary-color);
      color:var(--bg-color);
      font-size: 15px;
    }
      header{
        width: 1000;
        color:var(--terciary-color);
        background:var(--primary-color);
        font-size: 50px;
      }
      hgroup{
        text-align: center;
      }
      main{
      background:var(--bg-color)
      }               
      footer{
        text-align: center;
        color:var(--secondary-color);
        font-size: 25px;
      }
      section h3{
        background-color:var(--bg-color);
        text-align: center;
        color:var(--secondary-color);
        font-size: 50px;
      }
      section h4{
        text-align: center;
        background:var(--primary-color);
        color:var(--terciary-color);
        font-size: 30px;
      }
   </style>
</head>
