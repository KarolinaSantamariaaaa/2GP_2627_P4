<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>KCON Festival</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
   <style>
    /*hola*/
    *{
      box-sizing: border-box;
      padding: 0%;
      margin: 0%; 

    } 
    :root{
     --bg-color: #1f61dc;
     --primary-color: #A9EA05;
     --secondary-color: #FFFFFF;
     --terciary-color: #000004;
    }
     body {
        background:var(--bg-color);
        font-size: 8px;
      }
.dm-sans-cuerpo {
  font-family: "DM Sans", sans-serif;
  font-optical-sizing: auto;
  font-weight: 500;
  font-style: normal;
}
    div{
     width: 100%;
     text-align: center;
    }
    header h2{
      background:var(--secondary-color);
      color:var(--bg-color);
      font-size: 6em;
      text-transform: uppercase;
      border-radius: 70px;
      margin: 0.9em;
      padding: 0.1em 0.5em;
      display: inline-block;
      box-shadow: 10px 10px 0 var(--primary-color);
    }
    ul{
      text-align: center;
    }
    ul li{
      list-style-type: none;
      display: inline-block;
      margin: 0.5em;
      padding: 0.1em 0.5em;
      background:var(--secondary-color);
      color:var(--bg-color);
      font-size: 4em;
      border-radius: 50px;
      box-shadow: 10px 10px 0 var(--primary-color);
    }

      h1 span{
       width: fit-content;
        height: 20vh;
        margin: 0.30em auto;
        padding: 20px;
        color:var(--terciary-color);
        background:var(--primary-color);
        font-size: 6em;
        display: block;
      }
      h1 span:first-child{
      border-radius: 20px;
      box-shadow: 25px 10px 0 var(--terciary-color);
      }
      h1 span:last-child{
        border-radius: 50px;
        box-shadow: 25px 10px 0 var(--terciary-color);
      }
      hgroup{
        text-align: center;
      }
      main{
      width: 100%;
      height: 70vh;
      background:var(--bg-color);
      }
      section h3{
        margin: 0.5em auto;
        padding: 1em;
        background-color:var(--bg-color);
        text-align: center;
        color:var(--secondary-color);
        font-size: 5em;
        text-transform: uppercase;
      }
      section h4 span{
       width: fit-content;
       max-width: 100%;
       margin: 2em 0.30em;
       padding: 0.5em;
       text-align: center;
       background: var(--primary-color);
       color: var(--terciary-color);
       font-size: 5em;
       border-radius: 50px;
       display: inline-block;
       gap: 2em;
      }
      section h4 span:first-child{
        border-radius: 50px;
        box-shadow: 10px 10px 0 var(--terciary-color);
      }
      section h4 span:last-child {
       border-radius: 50px;
       box-shadow: 10px 10px 0 var(--terciary-color);
      }
            footer{
      width: 100%;
      height: 10vh;
      margin: 10em auto;
      padding: 1em;
      text-align: center;
      color:var(--secondary-color);
      font-size: 5em;
      }
   </style>
</head>
<body>
 <div class="datatype dm-sans-cuerpo">
  <header>
   <hgroup>
    <h1><span>KCON</span></br><span>2026</span></h1>
    <h2>Los Angeles</h2>
   </hgroup>
  </header>
<main>
 <section>

        <h4>
          <span>Day 1</span>

        <ul>
      <li>ATEZZ</li>

      <li>ENHYPEN</li>
      <li>INI</li></br>
      <li>ITZY</li>

      <li>Stray Kids</li>
    </ul>    
 </section>
 <section>
      <h4><span>Day 2</span>  
        <span><time datetime="2026-08-21">August 21</time> Sunday</span>
      </h4> 
        <ul>
      <li>JO1</li>
      <li>LOONA</li>
      <li>NCT DREAM</li>
      <li>NMIXX</li></br>
      <li>P1Harmony</li> 
      <li>STAYC</li>
      <li>THE BOYZ</li>
      <li>TO1</li>

     </ul>
      
 </section>
 </main>

<footer>
 <h5>Presented by Toyota</h5>

</footer>
 </div>
</body>
</html>
